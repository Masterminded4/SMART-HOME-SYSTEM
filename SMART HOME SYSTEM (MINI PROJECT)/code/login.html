<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
      animation: fadeIn 1.2s ease;
      width: 370px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 { color: #fff; margin-bottom: 20px; text-shadow: 0 0 10px #00bfff; }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
    }

    input { background: rgba(255, 255, 255, 0.9); }
    select { background: rgba(0, 191, 255, 0.8); color: #fff; cursor: pointer; }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #00bfff;
      color: #fff;
      font-size: 1.1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
      box-shadow: 0 0 15px #00bfff;
    }

    .login-btn:hover {
      background: #00ffff;
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffff;
    }

    .error {
      color: #ff8080;
      font-size: 0.9rem;
      margin-top: 10px;
      min-height: 18px;
    }

    .back-home {
      margin-top: 20px;
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .guest-box {
      display: none;
      margin-top: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px;
    }

    label {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 5px;
    }

    .guest-box input {
      width: 60%;
      margin-top: 5px;
    }

    /* RESET PASSWORD BOX */
    .reset-link {
      margin-top: 10px;
      color: cyan;
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-box {
      margin-top: 15px;
      background: rgba(255,255,255,0.12);
      padding: 12px;
      border-radius: 12px;
      display: none;
    }

    .reset-btn {
      background: #ff6b81;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #ff4757;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Smart Home Login</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required>
      <input type="password" id="password" placeholder="Enter Password (min 6 chars)" required>
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="parent">Parent</option>
        <option value="child">Child</option>
      </select>

      <label>
        <input type="checkbox" id="guestCheck" onclick="toggleGuest()"> Login as Guest Parent
      </label>

      <div class="guest-box" id="guestBox">
        <input type="number" id="guestDays" placeholder="Access period (in days)">
      </div>

      <button type="submit" class="login-btn">Login</button>
      <div class="error" id="errorMsg"></div>
    </form>

    <!-- RESET PASSWORD LINK -->
    <div class="reset-link" onclick="toggleReset()">Forgot / Reset Password?</div>

    <!-- RESET PASSWORD BOX -->
    <div class="reset-box" id="resetBox">
      <input type="text" id="resetUser" placeholder="Enter Username">
      <select id="resetRole">
        <option value="">Select Role</option>
        <option value="parent">Parent</option>
        <option value="child">Child</option>
      </select>
      <input type="password" id="resetPass" placeholder="Enter New Password (min 6 chars)">
      <button class="reset-btn" onclick="resetPassword()">Reset Password</button>
      <div class="error" id="resetMsg"></div>
    </div>

    <div class="back-home" onclick="location.href='index.html'">← Back to Home</div>
  </div>

  <script>
    function toggleGuest() {
      const guestBox = document.getElementById("guestBox");
      guestBox.style.display =
        document.getElementById("guestCheck").checked ? "block" : "none";
    }

    function toggleReset() {
      const box = document.getElementById("resetBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    // LOGIN HANDLER
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
      const isGuest = document.getElementById("guestCheck").checked;
      const guestDays = document.getElementById("guestDays").value;
      const errorMsg = document.getElementById("errorMsg");

      errorMsg.textContent = "";

      if (username === "") {
        errorMsg.textContent = "Please enter a username!";
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = "Password must be at least 6 characters!";
        return;
      }

      if (!role) {
        errorMsg.textContent = "Please select your role!";
        return;
      }

      if (isGuest && role !== "parent") {
        errorMsg.textContent = "Guest access is allowed for Parent role only!";
        return;
      }

      const userKey = `${role}_${username}`;
      const savedData = JSON.parse(localStorage.getItem(userKey));

      // Guest login setup
      if (isGuest) {
        if (!guestDays || guestDays <= 0) {
          errorMsg.textContent = "Please enter valid guest access duration!";
          return;
        }

        const expiry = new Date();
        expiry.setDate(expiry.getDate() + parseInt(guestDays));

        localStorage.setItem(userKey, JSON.stringify({
          password,
          role,
          isGuest: true,
          expiry: expiry.toISOString()
        }));

        sessionStorage.setItem("username", username);
        sessionStorage.setItem("role", role);
        redirect(role);
        return;
      }

      // Normal user login
      if (!savedData) {
        // First time user
        localStorage.setItem(userKey, JSON.stringify({ password, role, isGuest: false }));
        sessionStorage.setItem("username", username);
        sessionStorage.setItem("role", role);
        redirect(role);
      } else {
        // Guest expiry check
        if (savedData.isGuest) {
          const now = new Date();
          const expiryDate = new Date(savedData.expiry);
          if (now > expiryDate) {
            errorMsg.textContent = "⚠️ Guest access expired!";
            return;
          }
        }

        // Password check
        if (savedData.password === password) {
          sessionStorage.setItem("username", username);
          sessionStorage.setItem("role", role);
          redirect(role);
        } else {
          errorMsg.textContent = "❌ Incorrect password!";
        }
      }
    });

    // RESET PASSWORD HANDLER
    function resetPassword() {
      const username = document.getElementById("resetUser").value.trim();
      const role = document.getElementById("resetRole").value;
      const newPass = document.getElementById("resetPass").value.trim();
      const resetMsg = document.getElementById("resetMsg");

      resetMsg.textContent = "";

      if (!username || !role || newPass.length < 6) {
        resetMsg.textContent = "Please fill all fields correctly!";
        return;
      }

      const userKey = `${role}_${username}`;
      const savedData = JSON.parse(localStorage.getItem(userKey));

      if (!savedData) {
        resetMsg.textContent = "❌ User does not exist!";
        return;
      }

      savedData.password = newPass;
      localStorage.setItem(userKey, JSON.stringify(savedData));

      resetMsg.style.color = "lightgreen";
      resetMsg.textContent = "✅ Password reset successfully!";
    }

    function redirect(role) {
      if (role === "parent") {
        location.href = "parent_dashboard.html";
      } else {
        location.href = "child_dashboard.html";
      }
    }
  </script>
</body>
</html>
