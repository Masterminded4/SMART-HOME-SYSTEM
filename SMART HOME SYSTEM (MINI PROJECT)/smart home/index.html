<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Home Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      text-align: center;
    }

    .home-icon {
      font-size: 90px;
      color: #fff;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 15px #00bfff);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .welcome-text {
      color: #fff;
      font-size: 2.8rem;
      margin-top: 20px;
      font-weight: 600;
      text-shadow: 0 0 10px #00bfff, 0 0 20px #00bfff;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00bfff, 0 0 10px #00bfff; }
      to { text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; }
    }

    /* ⭐ New Parent-Child Bond Message Box */
    .bond-message {
      margin-top: 20px;
      max-width: 700px;
      color: #e6f9ff;
      font-size: 1.1rem;
      line-height: 1.6;
      padding: 18px 22px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-btn {
      margin-top: 40px;
      padding: 14px 40px;
      font-size: 1.2rem;
      color: #fff;
      background: #00bfff;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 15px #00bfff;
    }

    .login-btn:hover {
      background: #00ffff;
      transform: scale(1.1);
      box-shadow: 0 0 25px #00ffff;
    }

    /* Floating bubbles */
    .bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: rise 10s infinite ease-in;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="home-icon">🏠</div>
  <div class="welcome-text">Welcome to Smart Home</div>

  <!-- ⭐ Parent-Child Bond Message Box -->
  <div class="bond-message">
    "In every home, love begins with a parent’s care.<br>
    A child’s smile is the heart of every family.<br>
    Technology may guide the home, but emotions guide the bond.<br>
    Together, parents and children create a world of trust.<br>
    Welcome to a smarter, happier home."
  </div>

  <!-- Login Button -->
  <button class="login-btn" onclick="location.href='login.html'">Login</button>

  <audio id="welcomeAudio" src="welcome.mp3" preload="auto"></audio>

  <script>
    for (let i = 0; i < 20; i++) {
      let bubble = document.createElement('div');
      bubble.classList.add('bubble');
      let size = Math.random() * 80 + 20;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${8 + Math.random() * 5}s`;
      bubble.style.animationDelay = `${Math.random() * 5}s`;
      document.body.appendChild(bubble);
    }

    window.addEventListener('load', () => {
      const audio = document.getElementById('welcomeAudio');
      audio.play().catch(() => {
        document.body.addEventListener('click', () => audio.play(), { once: true });
      });
    });
  </script>

</body>
</html>
