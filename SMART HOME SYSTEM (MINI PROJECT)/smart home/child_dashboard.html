<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Child Dashboard — Smart Home</title>

<style>
  :root{
    --bg1:#0f2027;
    --bg2:#203a43;
    --accent:#00bfff;
  }

  body{
    margin:0;
    font-family:Inter,system-ui,Arial;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    transition:0.5s ease;
  }

  .wrap{
    width:980px;
    max-width:100%;
    display:grid;
    grid-template-columns:1fr 360px;
    gap:20px;
  }

  .card{
    background:rgba(255,255,255,0.04);
    border-radius:12px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }

  h1{margin:0 0 12px;}

  label{
    display:block;
    margin-top:10px;
    font-size:0.9rem;
    color:#e6f7ff;
  }

  select,input,textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.06);
    margin-top:6px;
    background:rgba(255,255,255,0.06);
    color:#fff;
    outline:none;
  }
  textarea{ min-height:86px;resize:vertical; }

  .btn{
    padding:10px 14px;
    border-radius:10px;
    background:var(--accent);
    color:#002;
    border:none;
    margin-top:12px;
    font-weight:600;
    cursor:pointer;
  }

  .status-list{
    max-height:58vh;
    overflow:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .req{
    background:rgba(255,255,255,0.03);
    padding:12px;
    border-radius:10px;
    border-left:4px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .status-pill{
    padding:6px 10px;
    border-radius:999px;
    font-weight:700;
  }

  .pending{ background:#f0b400;color:#2b1600; }
  .approved{ background:#00d27a;color:#022108; }
  .rejected{ background:#ff6b6b;color:#3d0000; }
  .expired{ background:#9aa0a6;color:#042; }

  .device-on{
    width:180px;
    height:120px;
    border-radius:12px;
    background:linear-gradient(135deg,#042e3f,#005063);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }

  .tv{ font-size:48px; }

  .logout{
    background:transparent;
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
  }

  .themeBox{ margin:10px 0; }
  #themePicker{
    width:220px;
    padding:10px;
    background:#ffffff22;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
  }
</style>
</head>

<body>

<div class="wrap">

  <!-- LEFT -->
  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1>Child Dashboard</h1>
        <div>Hello, <strong id="childName"></strong></div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <!-- THEME PICKER -->
    <div class="themeBox">
      <label>🎨 Choose Fun Theme</label>
      <select id="themePicker" onchange="applyTheme(this.value)">
        <option value="ocean">🌊 Ocean Blue</option>
        <option value="candy">🍭 Candy Pink</option>
        <option value="sunset">🌅 Sunset Orange</option>
        <option value="forest">🌲 Forest Green</option>
        <option value="galaxy">💜 Galaxy Purple</option>
        <option value="rainbow">🌈 Rainbow Fun Mode</option>
      </select>
    </div>

    <label>Select Device</label>
    <select id="device">
      <option value="">-- choose device --</option>
      <option>Smart TV</option>
      <option>Gaming Console</option>
      <option>Computer</option>
      <option>Air Conditioner</option>
    </select>

    <label>Reason</label>
    <textarea id="reason"></textarea>

    <label>Duration (minutes)</label>
    <input id="duration" type="number" min="1" value="30">

    <button class="btn" onclick="sendRequest()">Send Request</button>

    <h2 style="margin-top:16px;font-size:16px">My Requests</h2>
    <div class="status-list" id="myRequests"></div>

  </div>

  <!-- RIGHT -->
  <div class="card" style="text-align:center">
    <h3>Device Status</h3>
    <div id="devicePreview" class="device-on">
      <div class="tv">📺</div>
      <div id="deviceName">No device active</div>
      <div id="countdown" style="margin-top:8px;display:none;font-weight:bold"></div>
    </div>
  </div>

</div>


<script>
/* Child-only access */
if(sessionStorage.getItem("role")!=="child"){
  alert("Access denied");
  location.href="login.html";
}

document.getElementById("childName").textContent =
  sessionStorage.getItem("username") || "Child";

/* Storage helpers */
function readRequests(){ return JSON.parse(localStorage.getItem("requests")||"[]"); }
function writeRequests(a){ localStorage.setItem("requests",JSON.stringify(a)); updateUI(); }

/* THEME SYSTEM (same) */
let rainbowTimer=null;
function applyTheme(t){
  localStorage.setItem("childTheme",t);
  if(rainbowTimer) clearInterval(rainbowTimer);

  if(t==="ocean") setTheme("#0f2027","#203a43","#00bfff");
  if(t==="candy") setTheme("#ff77aa","#ff5599","#ffb3dd");
  if(t==="sunset") setTheme("#ff512f","#f09819","#ffd700");
  if(t==="forest") setTheme("#003300","#006600","#00cc44");
  if(t==="galaxy") setTheme("#1a0033","#330066","#cc66ff");

  if(t==="rainbow"){
    rainbowTimer=setInterval(()=>{
      const c1="#"+Math.floor(Math.random()*16777215).toString(16);
      const c2="#"+Math.floor(Math.random()*16777215).toString(16);
      setTheme(c1,c2,"#ffffff");
    },1500);
  }
}

function setTheme(bg1,bg2,accent){
  document.documentElement.style.setProperty("--bg1",bg1);
  document.documentElement.style.setProperty("--bg2",bg2);
  document.documentElement.style.setProperty("--accent",accent);
}

applyTheme(localStorage.getItem("childTheme") || "ocean");
document.getElementById("themePicker").value =
  localStorage.getItem("childTheme") || "ocean";

/* Send request */
function sendRequest(){
  const device=document.getElementById("device").value;
  const reason=document.getElementById("reason").value.trim();
  const minutes=parseInt(document.getElementById("duration").value);

  if(!device){ alert("Select device"); return; }
  if(!minutes || minutes<=0){ alert("Invalid duration"); return; }

  const r={
    id:Date.now(),
    child:sessionStorage.getItem("username"),
    device,
    reason,
    durationMinutes:minutes,
    status:"Pending",
    createdAt:Date.now()
  };

  const arr=readRequests();
  arr.unshift(r);
  writeRequests(arr);
}

/* My Requests list */
function renderMyRequests(){
  const list=document.getElementById("myRequests");
  const arr=readRequests().filter(
    r=>r.child===sessionStorage.getItem("username")
  );

  list.innerHTML="";

  arr.forEach(r=>{
    const div=document.createElement("div");
    div.className="req";

    div.innerHTML=`
      <div>
        <div style="font-weight:bold">${r.device}</div>
        <div style="opacity:0.7;font-size:0.85rem">Reason: ${r.reason || "Not provided"}</div>
        <div style="opacity:0.7;font-size:0.80rem">Requested: ${timeAgo(r.createdAt)}</div>
      </div>

      <div class="status-pill ${r.status.toLowerCase()}">${r.status}</div>
    `;

    list.appendChild(div);
  });
}

function timeAgo(t){
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60) return `${s}s ago`;
  if(s<3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

/* ⭐ UPDATED: Device Status with H:M:S countdown */
let countdownInterval=null;

function updatePreview(){
  const arr=readRequests();
  const now=Date.now();
  const active=arr.find(r=>r.status==="Approved" && r.approvedUntil>now);

  const dn=document.getElementById("deviceName");
  const cd=document.getElementById("countdown");

  if(countdownInterval) clearInterval(countdownInterval);

  if(active){
    dn.textContent=active.device+" — ON";
    cd.style.display="block";

    countdownInterval=setInterval(()=>{
      const remaining = active.approvedUntil - Date.now();

      if(remaining <= 0){
        cd.textContent="0h 0m 0s";
        clearInterval(countdownInterval);
        return;
      }

      const sec = Math.floor(remaining/1000) % 60;
      const min = Math.floor(remaining/(1000*60)) % 60;
      const hrs = Math.floor(remaining/(1000*60*60));

      cd.textContent = `${hrs}h ${min}m ${sec}s`;

    },1000);

  }else{
    dn.textContent="No device active";
    cd.style.display="none";
  }
}

/* Update all */
function updateUI(){
  renderMyRequests();
  updatePreview();
}
updateUI();

/* Logout */
function logout(){
  sessionStorage.clear();
  location.href="login.html";
}
</script>

</body>
</html>
